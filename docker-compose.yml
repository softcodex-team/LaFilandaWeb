# Solo l'app. Il database Postgres è una risorsa Coolify separata:
# DATABASE_URL va impostata nelle variabili d'ambiente (URL interno del database Coolify).
name: la-filanda

services:
  app:
    build:
      context: .
      args:
        SERVER_URL: ${SERVER_URL}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      SERVER_URL: ${SERVER_URL:?}
      CRON_SECRET: ${CRON_SECRET:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      MEDIA_DIR: /app/media
    expose:
      - '3000'
    volumes:
      - media:/app/media
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  media:
