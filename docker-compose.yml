name: la-filanda

services:
  app:
    build:
      context: .
      args:
        SERVER_URL: ${SERVER_URL}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lafilanda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lafilanda}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      SERVER_URL: ${SERVER_URL:?}
      CRON_SECRET: ${CRON_SECRET:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      MEDIA_DIR: /app/media
    expose:
      - '3000'
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lafilanda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-lafilanda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
