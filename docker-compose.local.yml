# Prova in locale con Postgres incluso:
#   docker compose -f docker-compose.local.yml --env-file .env.docker up -d --build
name: la-filanda-local

services:
  app:
    build:
      context: .
      args:
        SERVER_URL: ${SERVER_URL:-http://localhost:3000}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lafilanda}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-lafilanda}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      MEDIA_DIR: /app/media
    ports:
      - '3000:3000'
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lafilanda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-lafilanda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
